<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atıf Diamond Ürün Kataloğu</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f1d1a;--mut:#6f6a62;--line:#e4dfd5;--acc:#1f5c4a;--accink:#fff;--danger:#b3372b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171613;--card:#211f1b;--ink:#f1ede4;--mut:#a39d91;--line:#35322b;--acc:#5fb597;--accink:#10201a;--danger:#e57a6d}}
:root[data-theme="dark"]{--bg:#171613;--card:#211f1b;--ink:#f1ede4;--mut:#a39d91;--line:#35322b;--acc:#5fb597;--accink:#10201a;--danger:#e57a6d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:1.5rem;margin:0}
button,input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;max-width:100%}
button{cursor:pointer}button.p{background:var(--acc);color:var(--accink);border-color:var(--acc)}button.d{color:var(--danger)}
.rates{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:14px;font-size:.92rem}
.bar{display:flex;gap:8px;margin-bottom:14px}.bar input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}.chips button{border-radius:99px;padding:5px 14px}.chips .on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.img{aspect-ratio:4/3;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut)}.img img{width:100%;height:100%;object-fit:cover}
.body{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}.cat{font-size:.78rem;color:var(--mut)}.desc{color:var(--mut);white-space:pre-line}
.price{font-weight:700;font-size:1.15rem}.eur{font-size:.95rem;color:var(--mut)}.cost{font-size:.85rem;color:var(--mut)}
.login{max-width:340px;margin:18vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px}
.err{color:var(--danger);font-size:.9rem;min-height:1.2em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mbox{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
label{font-size:.85rem;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.two{display:flex;gap:8px}.two>*{flex:1;min-width:0}
.box{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 1) Firebase konsolundan aldığın değerleri buraya yapıştır
const firebaseConfig = {
  apiKey: "AIzaSyDBdSfyc0PmikQ_wdIH5PnhiOeBj_zOlDU",
  authDomain: "adia-35e1b.firebaseapp.com",
  projectId: "adia-35e1b",
  appId: "1:1064840168085:web:03229f4bfbd501d7b5519c"
};
const ADMIN_USER = "admin";          // yönetici kullanıcı adı
const DOMAIN = "@katalog.example";   // kullanıcı adının sonuna eklenen sahte e-posta uzantısı
const DEFAULT_CATS = ["Yüzük","Bileklik","Bilezik","Kolye","Küpe","Saat","Taş"];
window.claude = {use: async n => n === 'assets' ? {upload: f => shrink(f)} : null};
function shrink(f) {
  return new Promise((ok, no) => {
    const im = new Image(), u = URL.createObjectURL(f);
    im.onload = () => {
      const k = Math.min(1, 800 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      ok({id: c.toDataURL('image/jpeg', 0.75)});
    };
    im.onerror = no; im.src = u;
  });
}
// Ana fiyat = maliyet + (maliyet / 3 / 1,25)
const FORMULA = c => c / 3 / 1.25;
const COLORED = ["Yakut (Ruby)","Safir (Sapphire)","Zümrüt (Emerald)","Ametist","Akuamarin","Topaz","Mavi Topaz","Turmalin","Granat","Peridot","Opal","Tanzanit","Sitrin","Morganit","Spinel","Aleksandrit","Turkuaz (Firuze)","Lapis Lazuli","Oniks","Mercan","İnci","Kunzit","Tsavorit","Rodolit","Ay Taşı","Kuvars","Zirkon","Heliodor","Diğer"];
const CLARITY = ["FL","IF","VVS1","VVS2","VS1","VS2","SI1","SI2","I1","I2","I3"];
const SCALES = {"GIA (D–Z)": "DEFGHIJKLMNOPQRSTUVWXYZ".split(''), "Eski (River–Cape)": ["River (D-E)","Top Wesselton (F)","Wesselton (G-H)","Top Crystal (I-J)","Crystal (K-L)","Top Cape (M-N)","Cape (O-Z)"]};
const $ = s => document.querySelector(s);
let D = {cats:[],products:[],rates:{}}, auth = false, admin = false, q = '', cat = 'Tümü', ed = null, rt = false, err = '', view = null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n, c) => new Intl.NumberFormat('tr-TR', {style:'currency', currency:c}).format(n);
const num = n => +n ? new Intl.NumberFormat('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}).format(n) : '–';
const rate = c => c === 'USD' ? +D.rates.usd : c === 'EUR' ? +D.rates.eur : 1;
function price(p) {
  const e = +D.rates.eur;
  if (admin) { const r = rate(p.cu || 'TRY'); if (!r) return null; const base = (+p.cost || 0) * r, tl = base + FORMULA(base); return {base, add:FORMULA(base), tl, eur: e ? tl / e : null}; }
  return p.tl ? {tl:p.tl, eur: e ? p.tl / e : null} : null;
}
const priceHtml = p => { const r = price(p); return r ? `<span class="price">${fmt(r.tl,'TRY')}</span>${r.eur ? `<span class="eur">${fmt(r.eur,'EUR')}</span>` : ''}` : '<span class="cost">Kur girilmedi</span>'; };
const opts = (arr, v) => arr.map(a => `<option ${a === v ? 'selected' : ''}>${esc(a)}</option>`).join('');
function stoneLines(p) {
  const s = p.st || {}; if (p.cat === 'Saat') return [];
  if (s.t === 'clear') return ['Taş: Renksiz (pırlanta)', s.clarity && 'Berraklık: ' + s.clarity, s.color && 'Renk (' + (s.scale || 'GIA (D–Z)') + '): ' + s.color, +s.ct && 'Karat: ' + s.ct].filter(Boolean);
  if (s.t === 'color') return ['Taş: Renkli taş', s.name && 'Cins: ' + s.name, +s.ct && 'Karat: ' + s.ct].filter(Boolean);
  return [];
}
function render() {
  const app = $('#app');
  if (!auth) {
    app.innerHTML = `<div class="login"><h1>Giriş</h1><input id="u" placeholder="Kullanıcı adı" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><input id="p" type="password" placeholder="Şifre" autocomplete="current-password"><div class="err">${esc(err)}</div><button class="p" id="go">Giriş yap</button></div>`;
    $('#go').onclick = login; $('#p').onkeydown = e => { if (e.key === 'Enter') login(); }; return;
  }
  const R = D.rates, list = D.products.filter(p => (cat === 'Tümü' || p.cat === cat) && p.name.toLowerCase().includes(q.toLowerCase()));
  app.innerHTML = `<div class="rates"><span>Gram altın: <b>${num(R.gold)} ₺</b></span><span>USD: <b>${num(R.usd)} ₺</b></span><span>EUR: <b>${num(R.eur)} ₺</b></span><span class="cost">${esc(R.at)}</span>${admin ? '<button id="rt">Kurları güncelle</button>' : ''}</div>
  <header><h1>Ürün Kataloğu</h1><div class="row">${admin ? '<button id="add" class="p">+ Ürün</button><button id="addc">+ Kategori</button>' : ''}<button id="out">Çıkış</button></div></header>
  <div class="bar"><input id="q" placeholder="Ürün ara…" value="${esc(q)}"></div>
  <div class="chips">${['Tümü', ...D.cats].map(c => `<button class="${c === cat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="grid">${list.map(p => `<div class="card" data-v="${p.id}"><div class="img">${p.img ? `<img src="${esc(p.img)}" alt="${esc(p.name)}">` : 'Görsel yok'}</div><div class="body"><span class="cat">${esc(p.cat)}</span><strong>${esc(p.name)}</strong>${priceHtml(p)}${admin ? `<button data-e="${p.id}">Düzenle</button>` : ''}</div></div>`).join('') || '<p>Henüz ürün yok.</p>'}</div>
  ${ed ? editor() : ''}${rt ? ratesBox() : ''}${view ? viewer() : ''}`;
  $('#q').oninput = e => { q = e.target.value; render(); const i = $('#q'); i.focus(); i.setSelectionRange(q.length, q.length); };
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; render(); });
  app.querySelectorAll('[data-v]').forEach(c => c.onclick = () => { view = D.products.find(p => p.id === c.dataset.v); render(); });
  $('#out').onclick = logout;
  if (view) { $('#vx').onclick = () => { view = null; render(); }; const ve = $('#ve'); if (ve) ve.onclick = () => { ed = JSON.parse(JSON.stringify(view)); view = null; render(); }; }
  if (!admin) return;
  app.querySelectorAll('[data-e]').forEach(b => b.onclick = e => { e.stopPropagation(); ed = JSON.parse(JSON.stringify(D.products.find(p => p.id === b.dataset.e))); render(); });
  $('#add').onclick = () => { ed = {id:'p' + Date.now(), name:'', cat:D.cats[0], cost:0, cu:'TRY', gram:'', desc:'', img:'', st:{t:'none'}, isNew:true}; render(); };
  $('#addc').onclick = () => { const n = prompt('Yeni kategori adı:'); if (n && !D.cats.includes(n)) saveMeta({cats: [...D.cats, n]}); };
  $('#rt').onclick = () => { rt = true; render(); };
  if (ed) bindEditor(); if (rt) bindRates();
}
function viewer() {
  const p = view, r = price(p), L = stoneLines(p);
  return `<div class="modal"><div class="mbox"><div class="img" style="border-radius:10px;overflow:hidden">${p.img ? `<img src="${esc(p.img)}" alt="${esc(p.name)}">` : 'Görsel yok'}</div><span class="cat">${esc(p.cat)}</span><h1>${esc(p.name)}</h1>${priceHtml(p)}
  ${+p.gram ? `<span class="cost">Altın: ${esc(p.gram)} gr</span>` : ''}${L.map(l => `<span class="cost">${esc(l)}</span>`).join('')}
  ${p.desc ? `<p class="desc" style="margin:0">${esc(p.desc)}</p>` : ''}
  ${admin ? `<div class="box"><b>Maliyet</b><span>${fmt(+p.cost || 0, p.cu || 'TRY')}${r ? ` (${fmt(r.base,'TRY')})` : ''}</span>${r ? `<span class="cost">Formül değeri: ${fmt(r.add,'TRY')}</span>` : ''}</div>` : ''}
  <div class="row">${admin ? '<button id="ve">Düzenle</button>' : ''}<button class="p" id="vx">Kapat</button></div></div></div>`;
}
function editor() {
  const s = ed.st || (ed.st = {t:'none'}), T = {none:'Yok', clear:'Renksiz (pırlanta)', color:'Renkli taş'}, sc = s.scale || 'GIA (D–Z)';
  const stone = ed.cat === 'Saat' ? '' : `<div class="box"><label>Taş<select id="st">${Object.entries(T).map(([k, v]) => `<option value="${k}" ${k === s.t ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
  ${s.t === 'clear' ? `<label>Berraklık<select id="cl">${opts(CLARITY, s.clarity)}</select></label><label>Renk skalası<select id="sc">${opts(Object.keys(SCALES), sc)}</select></label><label>Renk<select id="co">${opts(SCALES[sc], s.color)}</select></label>` : ''}
  ${s.t === 'color' ? `<label>Taş cinsi<select id="sn">${opts(COLORED, s.name)}</select></label>` : ''}
  ${s.t !== 'none' ? `<label>Karat<input id="ct" type="number" step="0.01" value="${esc(s.ct || '')}"></label>` : ''}</div>`;
  return `<div class="modal"><div class="mbox"><h1>${ed.isNew ? 'Yeni ürün' : 'Ürünü düzenle'}</h1>
  <div class="img" style="border-radius:10px;overflow:hidden">${ed.img ? `<img src="${esc(ed.img)}">` : 'Görsel yok'}</div>
  <div class="row" style="justify-content:flex-start"><button type="button" id="cam">📷 Fotoğraf çek</button><button type="button" id="gal">🖼️ Galeriden yükle</button></div><input type="file" id="f" accept="image/*" hidden><input type="file" id="fc" accept="image/*" capture="environment" hidden>
  <label>Ürün adı<input id="n" value="${esc(ed.name)}"></label>
  <label>Kategori<select id="c">${opts(D.cats, ed.cat)}</select></label>
  <label>Maliyet fiyatı<div class="two"><input id="m" type="number" step="0.01" value="${esc(ed.cost)}"><select id="cu">${opts(['TRY','USD','EUR'], ed.cu || 'TRY')}</select></div></label>
  <label>Kullanılan altın (gr)<input id="g" type="number" step="0.01" value="${esc(ed.gram || '')}"></label>
  ${stone}
  <label>Açıklama<textarea id="d" rows="4">${esc(ed.desc)}</textarea></label>
  <div class="row">${ed.isNew ? '' : '<button class="d" id="del">Sil</button>'}<button id="x">Vazgeç</button><button class="p" id="ok">Tamam</button></div></div></div>`;
}
function grab() {
  const v = id => { const e = $(id); return e ? e.value : undefined; };
  ed.name = v('#n'); ed.cat = v('#c'); ed.cost = +v('#m') || 0; ed.cu = v('#cu'); ed.gram = v('#g'); ed.desc = v('#d');
  const s = ed.st || (ed.st = {t:'none'});
  [['#st','t'],['#cl','clarity'],['#sc','scale'],['#co','color'],['#sn','name'],['#ct','ct']].forEach(([id, k]) => { const x = v(id); if (x !== undefined) s[k] = x; });
}
function bindEditor() {
  $('#x').onclick = () => { ed = null; render(); };
  ['#c', '#st', '#sc'].forEach(id => { const e = $(id); if (e) e.onchange = () => { grab(); if (id === '#sc') ed.st.color = ''; render(); }; });
  $('#cam').onclick = openCam; $('#gal').onclick = () => $('#f').click();
  $('#fc').onchange = $('#f').onchange = async e => {
    const a = await claude.use('assets'); if (!a) return alert('Görsel yükleme bu görünümde kullanılamıyor.');
    try { grab(); const r = await a.upload(e.target.files[0]); ed.img = r.id; render(); } catch (x) { alert('Yükleme başarısız.'); }
  };
  $('#ok').onclick = async () => { grab(); const p = JSON.parse(JSON.stringify(ed)); ed = null; render(); await saveProduct(p); };
  const del = $('#del'); if (del) del.onclick = async () => { if (confirm('Bu ürün silinsin mi?')) { const id = ed.id; ed = null; render(); await delProduct(id); } };
}
async function upBlob(f) {
  const a = await claude.use('assets'); if (!a) return alert('Görsel yükleme bu görünümde kullanılamıyor.');
  try { grab(); const r = await a.upload(f); ed.img = r.id; render(); } catch (x) { alert('Yükleme başarısız.'); }
}
async function openCam() {
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch (e) { $('#fc').click(); return; }
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="mbox"><video id="cv" autoplay playsinline muted style="width:100%;border-radius:10px"></video><div class="row"><button id="cx">Vazgeç</button><button class="p" id="cs">Çek</button></div></div>';
  document.body.appendChild(m); const v = m.querySelector('#cv'); v.srcObject = stream;
  const stop = () => { stream.getTracks().forEach(t => t.stop()); m.remove(); };
  m.querySelector('#cx').onclick = stop;
  m.querySelector('#cs').onclick = () => { const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0); c.toBlob(b => { stop(); if (b) upBlob(b); }, 'image/jpeg', 0.9); };
}
function ratesBox() {
  const R = D.rates;
  return `<div class="modal"><div class="mbox"><h1>Kurlar</h1><p class="cost" style="margin:0">Güncel değerleri <a href="https://www.haremaltin.com" target="_blank" rel="noopener">haremaltin.com</a> sitesinden bakıp gir (₺ cinsinden).</p>
  <label>Gram altın<input id="rg" type="number" step="0.01" value="${esc(R.gold || '')}"></label><label>USD<input id="ru" type="number" step="0.0001" value="${esc(R.usd || '')}"></label><label>EUR<input id="re" type="number" step="0.0001" value="${esc(R.eur || '')}"></label>
  <div class="row"><button id="rx">Kapat</button><button class="p" id="rk">Kaydet</button></div></div></div>`;
}
function bindRates() {
  $('#rx').onclick = () => { rt = false; render(); };
  $('#rk').onclick = async () => {
    const r = {gold:+$('#rg').value || 0, usd:+$('#ru').value || 0, eur:+$('#re').value || 0, at:'Son güncelleme: ' + new Date().toLocaleString('tr-TR', {dateStyle:'short', timeStyle:'short'})};
    rt = false; META.rates = r; D.rates = r; render(); await saveMeta({rates: r});
    await guard(async () => { const b = writeBatch(fdb); D.products.forEach(p => b.update(doc(fdb, 'products', p.id), {tl: tlOf(p)})); await b.commit(); });
  };
}
let P = [], C = {}, META = {cats: DEFAULT_CATS, rates: {gold:0, usd:0, eur:0, at:''}}, unsubs = [];
const fapp = initializeApp(firebaseConfig), fauth = getAuth(fapp), fdb = getFirestore(fapp);
const emailOf = u => { u = u.trim().toLowerCase(); return u.includes('@') ? u : u + DOMAIN; };
const clean = o => JSON.parse(JSON.stringify(o));
const tlOf = p => { const r = rate(p.cu || 'TRY'); if (!r) return null; const b = (+p.cost || 0) * r; return b + FORMULA(b); };
async function guard(fn) { try { await fn(); } catch (e) { alert('Kaydedilemedi: ' + (e.code || e.message)); } }
const saveProduct = p => guard(async () => {
  const {cost, cu, isNew, ...pub} = p;
  await setDoc(doc(fdb, 'products', p.id), clean({...pub, tl: tlOf(p)}));
  await setDoc(doc(fdb, 'costs', p.id), clean({cost: cost || 0, cu: cu || 'TRY'}));
});
const delProduct = id => guard(async () => { await deleteDoc(doc(fdb, 'products', id)); await deleteDoc(doc(fdb, 'costs', id)); });
const saveMeta = patch => guard(async () => { await setDoc(doc(fdb, 'meta', 'main'), clean({cats: D.cats, rates: D.rates, ...patch})); });
function rebuild() {
  D = {cats: META.cats || DEFAULT_CATS, rates: META.rates || {gold:0, usd:0, eur:0, at:''}, products: P.map(p => admin ? {...p, ...(C[p.id] || {})} : p)};
}
function refresh() { rebuild(); if (!ed && !rt) render(); }
const onErr = e => console.error(e);
const LOGIN_ERR = {
  'auth/invalid-credential': 'Kullanıcı adı veya şifre hatalı.',
  'auth/wrong-password': 'Kullanıcı adı veya şifre hatalı.',
  'auth/user-not-found': 'Kullanıcı adı veya şifre hatalı.',
  'auth/invalid-email': 'Kullanıcı adı geçersiz.',
  'auth/unauthorized-domain': 'Bu site adresi Firebase\'de yetkili değil. Authentication > Settings > Authorized domains kısmına ekle.',
  'auth/operation-not-allowed': 'Firebase\'de Email/Password girişi kapalı. Authentication > Sign-in method kısmından aç.',
  'auth/network-request-failed': 'İnternet bağlantısı hatası. Tekrar dene.',
  'auth/too-many-requests': 'Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.',
  'auth/invalid-api-key': 'Koddaki apiKey hatalı.',
  'auth/api-key-not-valid': 'Koddaki apiKey hatalı.'
};
async function login() {
  const u = $('#u').value, p = $('#p').value;
  if (!u.trim() || !p) { err = 'Kullanıcı adı ve şifreyi yaz.'; return render(); }
  try { await signInWithEmailAndPassword(fauth, emailOf(u), p); err = ''; }
  catch (e) { err = LOGIN_ERR[e.code] || ('Giriş yapılamadı: ' + (e.code || e.message)); console.error(e); render(); $('#u').value = u; }
}
function logout() { signOut(fauth); }
onAuthStateChanged(fauth, u => {
  unsubs.forEach(f => f()); unsubs = []; P = []; C = {};
  if (!u) { auth = false; admin = false; return render(); }
  auth = true; admin = u.email === emailOf(ADMIN_USER);
  unsubs.push(onSnapshot(collection(fdb, 'products'), s => { P = s.docs.map(d => d.data()); refresh(); }, onErr));
  unsubs.push(onSnapshot(doc(fdb, 'meta', 'main'), s => { if (s.exists()) META = s.data(); rebuild(); if (!s.exists() && admin) saveMeta({}); refresh(); }, onErr));
  if (admin) unsubs.push(onSnapshot(collection(fdb, 'costs'), s => { C = {}; s.docs.forEach(d => C[d.id] = d.data()); refresh(); }, onErr));
