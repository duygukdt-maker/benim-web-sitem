<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urun Katalogu</title>
<style>
body { font-family: Arial, sans-serif; background: #f6f4ef; color: #1f1d1a; margin: 0; padding: 20px; }
.box { max-width: 350px; margin: 100px auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
button { background: #1f5c4a; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
.err { color: #b3372b; font-size: 14px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
let auth = false;
let db = {
  admin: { user: "admin", pass: "1234" },
  viewer: { user: "musteri", pass: "1234" },
  products: []
};

function render() {
  const app = document.getElementById("app");
  if (!auth) {
    app.innerHTML = `
      <div class="box">
        <h2>Giris Yap</h2>
        <input id="u" placeholder="Kullanici Adi">
        <input id="p" type="password" placeholder="Sifre">
        <div id="err" class="err"></div>
        <button onclick="girisYap()">Giris Yap</button>
      </div>
    `;
  } else {
    app.innerHTML = `
      <div style="max-width:800px; margin:0 auto;">
        <h1>Urun Katalogu</h1>
        <p>Hos geldiniz! Basariyla giris yaptiniz.</p>
        <button onclick="cikisYap()" style="width:auto; padding:5px 15px;">Cikis Yap</button>
      </div>
    `;
  }
}

function girisYap() {
  const u = document.getElementById("u").value.trim();
  const p = document.getElementById("p").value.trim();
  
  if (u === db.admin.user && p === db.admin.pass) {
    auth = true;
    render();
  } else if (u === db.viewer.user && p === db.viewer.pass) {
    auth = true;
    render();
  } else {
    document.getElementById("err").innerText = "Kullanici adi veya sifre hatali!";
  }
}

function cikisYap() {
  auth = false;
  render();
}

render();
</script>

</body>
</html>
