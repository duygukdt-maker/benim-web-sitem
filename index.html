
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ürün Kataloğu</title>
<style>
:root {
  --bg:#f6f4ef; --card:#fff; --ink:#24211d;
  --muted:#777167; --line:#e4dfd5; --accent:#205b49;
  --danger:#b3372b;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select,textarea {
  font:inherit; max-width:100%; padding:10px 12px;
  border:1px solid var(--line); border-radius:9px;
  background:var(--card); color:var(--ink);
}
button { cursor:pointer; }
button.primary { background:var(--accent); color:white; border-color:var(--accent); }
button.danger { color:var(--danger); }
button:disabled { opacity:.5; cursor:not-allowed; }
.wrap { max-width:1100px; margin:auto; padding:18px 15px 50px; }
header,.toolbar,.row {
  display:flex; align-items:center; flex-wrap:wrap; gap:9px;
}
header { justify-content:space-between; margin-bottom:16px; }
h1 { font-size:1.5rem; margin:0; }
h2 { font-size:1.2rem; margin:0; }
.toolbar { margin:14px 0; }
.toolbar input { flex:1; min-width:160px; }
.rates {
  display:flex; flex-wrap:wrap; gap:10px 20px;
  padding:12px; border:1px solid var(--line);
  background:var(--card); border-radius:12px;
}
.chips { display:flex; flex-wrap:wrap; gap:7px; margin:15px 0; }
.chips button { border-radius:30px; }
.chips .active { background:var(--accent); color:white; }
.grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:14px;
}
.product {
  background:var(--card); border:1px solid var(--line);
  border-radius:13px; overflow:hidden; display:flex;
  flex-direction:column;
}
.photo {
  width:100%; aspect-ratio:4/3; object-fit:cover;
  background:#e9e5dc; display:block;
}
.no-photo {
  aspect-ratio:4/3; display:grid; place-items:center;
  color:var(--muted); background:#e9e5dc;
}
.product-body { padding:13px; display:flex; flex-direction:column; gap:6px; }
.muted { color:var(--muted); font-size:.9rem; }
.price { font-size:1.15rem; font-weight:700; }
.card-actions { display:flex; gap:7px; flex-wrap:wrap; margin-top:6px; }
.login {
  max-width:360px; margin:12vh auto; padding:24px;
  background:var(--card); border:1px solid var(--line);
  border-radius:15px; display:flex; flex-direction:column; gap:12px;
}
.login input { width:100%; }
.error { color:var(--danger); min-height:1.3em; }
.overlay {
  position:fixed; inset:0; z-index:10;
  background:#0008; display:flex; justify-content:center;
  align-items:center; padding:14px;
}
.modal {
  background:var(--bg); border-radius:14px; padding:20px;
  width:100%; max-width:520px; max-height:92vh; overflow:auto;
  display:flex; flex-direction:column; gap:12px;
}
.modal label { display:flex; flex-direction:column; gap:5px; font-size:.9rem; }
.modal input,.modal select,.modal textarea { width:100%; }
.modal .row { justify-content:flex-end; }
.empty { padding:30px 10px; text-align:center; color:var(--muted); }
.hidden { display:none !important; }
.small { font-size:.82rem; color:var(--muted); }
@media(max-width:480px) {
  .wrap { padding:12px 10px 35px; }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .product-body { padding:9px; }
  .product-body button { padding:8px; font-size:.85rem; }
  h1 { font-size:1.25rem; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";

/*
  BAĞIMSIZ GITHUB PAGES SÜRÜMÜ
  Veriler bu tarayıcıda localStorage içinde tutulur.
*/

const STORAGE_KEY = "urun_katalog_v1";

const DEFAULT_DATA = {
  accounts: {
    admin: { user: "admin", pass: "admin123" },
    viewer: { user: "musteri", pass: "musteri123" }
  },
  rates: { gold: 0, usd: 0, eur: 0 },
  categories: ["Yüzük", "Kolye", "Bileklik", "Küpe", "Saat"],
  products: []
};

let data = readData();
let currentRole = null;
let currentCategory = "Tümü";
let searchText = "";
let editingId = null;
let viewingId = null;
let modalType = null;
let loginError = "";

const app = document.getElementById("app");

function readData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && parsed.accounts && parsed.products && parsed.rates) {
        return parsed;
      }
    }
  } catch (e) {
    console.warn("Kayıt okunamadı:", e);
  }
  return structuredClone(DEFAULT_DATA);
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    alert("Veriler kaydedilemedi. Fotoğraflar çok büyük olabilir. Daha küçük bir fotoğraf deneyin.");
    return false;
  }
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[ch]);
}

function money(value, currency = "TRY") {
  const n = Number(value);
  if (!Number.isFinite(n)) return "—";
  try {
    return new Intl.NumberFormat("tr-TR", {
      style:"currency", currency, maximumFractionDigits:2
    }).format(n);
  } catch {
    return n.toLocaleString("tr-TR") + " " + currency;
  }
}

function number(value) {
  return (Number(value) || 0).toLocaleString("tr-TR", {
    maximumFractionDigits:2
  });
}

function isAdmin() {
  return currentRole === "admin";
}

function calculatePrice(product) {
  const cost = Number(product.cost) || 0;
  const currency = product.currency || "TRY";
  const rate = currency === "USD" ? Number(data.rates.usd)
    : currency === "EUR" ? Number(data.rates.eur) : 1;

  if (!rate || rate < 0) return null;

  const baseTRY = cost * rate;
  const sellingTRY = baseTRY + baseTRY / 3 / 1.25;
  const eurRate = Number(data.rates.eur);

  return {
    baseTRY,
    sellingTRY,
    sellingEUR: eurRate > 0 ? sellingTRY / eurRate : null
  };
}

function productPriceHTML(product) {
  const p = calculatePrice(product);
  if (!p) return '<span class="muted">Döviz kuru girilmedi</span>';

  return `<div class="price">${money(p.sellingTRY)}</div>
    ${p.sellingEUR !== null
      ? `<div class="muted">${money(p.sellingEUR, "EUR")}</div>` : ""}`;
}

function imageHTML(product, large = false) {
  if (!product.image) {
    return '<div class="no-photo">Görsel yok</div>';
  }
  return `<img class="photo" src="${product.image}"
    alt="${escapeHTML(product.name)}"
    style="${large ? "border-radius:10px" : ""}">`;
}

function render() {
  if (!currentRole) {
    renderLogin();
    return;
  }

  const filtered = data.products.filter(p => {
    const matchesCategory = currentCategory === "Tümü" ||
      p.category === currentCategory;
    const term = searchText.toLocaleLowerCase("tr-TR");
    const matchesSearch = String(p.name || "")
      .toLocaleLowerCase("tr-TR").includes(term);
    return matchesCategory && matchesSearch;
  });

  app.innerHTML = `
    <div class="rates">
      <span>Gram altın: <b>${number(data.rates.gold)} ₺</b></span>
      <span>USD: <b>${number(data.rates.usd)} ₺</b></span>
      <span>EUR: <b>${number(data.rates.eur)} ₺</b></span>
      ${isAdmin() ? '<button id="editRates">Kurları düzenle</button>' : ""}
    </div>

    <header>
      <h1>Ürün Kataloğu</h1>
      <div class="row">
        ${isAdmin() ? `
          <button class="primary" id="addProduct">+ Ürün ekle</button>
          <button id="addCategory">+ Kategori</button>
          <button id="settings">Ayarlar</button>
        ` : ""}
        <button id="logout">Çıkış</button>
      </div>
    </header>

    <div class="toolbar">
      <input id="search" placeholder="Ürün ara..." value="${escapeHTML(searchText)}">
    </div>

    <div class="chips">
      ${["Tümü", ...data.categories].map(c => `
        <button data-category="${escapeHTML(c)}"
          class="${currentCategory === c ? "active" : ""}">
          ${escapeHTML(c)}
        </button>`).join("")}
    </div>

    <div class="grid">
      ${filtered.map(p => `
        <article class="product">
          ${imageHTML(p)}
          <div class="product-body">
            <div class="muted">${escapeHTML(p.category)}</div>
            <strong>${escapeHTML(p.name)}</strong>
            ${productPriceHTML(p)}
            ${p.description
              ? `<div class="muted">${escapeHTML(p.description)}</div>` : ""}
            ${isAdmin() ? `
              <div class="card-actions">
                <button data-edit="${escapeHTML(p.id)}">Düzenle</button>
                <button class="danger" data-delete="${escapeHTML(p.id)}">Sil</button>
              </div>` : ""}
            <div class="card-actions">
              <button data-view="${escapeHTML(p.id)}">Detaylar</button>
            </div>
          </div>
        </article>
      `).join("")}
    </div>

    ${filtered.length ? "" : '<div class="empty">Gösterilecek ürün bulunamadı.</div>'}
    <p class="small">Bu katalogdaki kayıtlar bu tarayıcıda saklanır.</p>
    ${modalType === "product" ? productModal() : ""}
    ${modalType === "rates" ? ratesModal() : ""}
    ${modalType === "settings" ? settingsModal() : ""}
    ${modalType === "view" ? viewModal() : ""}
  `;

  bindMainEvents();

  if (modalType === "product") bindProductEvents();
  if (modalType === "rates") bindRatesEvents();
  if (modalType === "settings") bindSettingsEvents();
  if (modalType === "view") bindViewEvents();
}

function renderLogin() {
  app.innerHTML = `
    <div class="login">
      <h1>Ürün Kataloğu</h1>
      <p>Devam etmek için giriş yap.</p>
      <label>Kullanıcı adı
        <input id="username" autocomplete="username" placeholder="Kullanıcı adı">
      </label>
      <label>Şifre
        <input id="password" type="password"
          autocomplete="current-password" placeholder="Şifre">
      </label>
      <div class="error">${escapeHTML(loginError)}</div>
      <button class="primary" id="loginButton">Giriş yap</button>
    </div>`;

  document.getElementById("loginButton").onclick = login;
  document.getElementById("password").onkeydown = e => {
    if (e.key === "Enter") login();
  };
}

function login() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;

  const accountAdmin = data.accounts.admin;
  const accountViewer = data.accounts.viewer;

  if (user === accountAdmin.user && pass === accountAdmin.pass) {
    currentRole = "admin";
  } else if (user === accountViewer.user && pass === accountViewer.pass) {
    currentRole = "viewer";
  } else {
    loginError = "Kullanıcı adı veya şifre hatalı.";
    renderLogin();
    return;
  }

  loginError = "";
  render();
}

function bindMainEvents() {
  document.getElementById("logout").onclick = () => {
    currentRole = null;
    modalType = null;
    loginError = "";
    render();
  };

  document.getElementById("search").oninput = e => {
    const cursor = e.target.selectionStart;
    searchText = e.target.value;
    render();
    const input = document.getElementById("search");
    input.focus();
    input.setSelectionRange(cursor, cursor);
  };

  app.querySelectorAll("[data-category]").forEach(button => {
    button.onclick = () => {
      currentCategory = button.dataset.category;
      render();
    };
  });

  app.querySelectorAll("[data-view]").forEach(button => {
    button.onclick = () => {
      viewingId = button.dataset.view;
      modalType = "view";
      render();
    };
  });

  if (isAdmin()) {
    document.getElementById("addProduct").onclick = () => {
      editingId = null;
      modalType = "product";
      render();
    };

    document.getElementById("addCategory").onclick = addCategory;

    document.getElementById("editRates").onclick = () => {
      modalType = "rates";
      render();
    };

    document.getElementById("settings").onclick = () => {
      modalType = "settings";
      render();
    };

    app.querySelectorAll("[data-edit]").forEach(button => {
      button.onclick = () => {
        editingId = button.dataset.edit;
        modalType = "product";
        render();
      };
    });

    app.querySelectorAll("[data-delete]").forEach(button => {
      button.onclick = () => deleteProduct(button.dataset.delete);
    });
  }
}

function addCategory() {
  const name = prompt("Yeni kategori adı:");
  if (!name || !name.trim()) return;

  const clean = name.trim();
  if (data.categories.some(c => c.toLocaleLowerCase("tr-TR") ===
      clean.toLocaleLowerCase("tr-TR"))) {
    alert("Bu kategori zaten var.");
    return;
  }

  data.categories.push(clean);
  persist();
  render();
}

function deleteProduct(id) {
  const product = data.products.find(p => p.id === id);
  if (!product) return;

  if (!confirm(`"${product.name}" silinsin mi?`)) return;

  data.products = data.products.filter(p => p.id !== id);
  persist();
  render();
}

function productModal() {
  const product = editingId
    ? data.products.find(p => p.id === editingId)
    : null;

  const p = product || {
    name:"", category:data.categories[0] || "", cost:"",
    currency:"TRY", gram:"", description:"", image:""
  };

  return `
    <div class="overlay">
      <div class="modal">
        <h2>${product ? "Ürünü düzenle" : "Yeni ürün"}</h2>
        <div id="imagePreview">${imageHTML(p, true)}</div>

        <label>Ürün fotoğrafı
          <input id="productImage" type="file" accept="image/*">
        </label>
        <div class="small">Fotoğraf seçtiğinde küçük boyuta dönüştürülerek kaydedilir.</div>

        <label>Ürün adı
          <input id="productName" maxlength="150"
            value="${escapeHTML(p.name)}" required>
        </label>

        <label>Kategori
          <select id="productCategory">
            ${data.categories.map(c => `
              <option ${c === p.category ? "selected" : ""}>${escapeHTML(c)}</option>
            `).join("")}
          </select>
        </label>

        <label>Maliyet
          <input id="productCost" type="number" min="0" step="0.01"
            value="${escapeHTML(p.cost)}">
        </label>

        <label>Maliyet para birimi
          <select id="productCurrency">
            ${["TRY","USD","EUR"].map(c => `
              <option value="${c}" ${c === p.currency ? "selected" : ""}>${c}</option>
            `).join("")}
          </select>
        </label>

        <label>Kullanılan altın (gram)
          <input id="productGram" type="number" min="0" step="0.01"
            value="${escapeHTML(p.gram || "")}">
        </label>

        <label>Açıklama
          <textarea id="productDescription" rows="4">${escapeHTML(p.description || "")}</textarea>
        </label>

        <div class="row">
          <button id="cancelProduct">Vazgeç</button>
          <button class="primary" id="saveProduct">Kaydet</button>
        </div>
      </div>
    </div>`;
}

let pendingImage = null;

function bindProductEvents() {
  const fileInput = document.getElementById("productImage");
  pendingImage = editingId
    ? (data.products.find(p => p.id === editingId)?.image || null)
    : null;

  fileInput.onchange = async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      alert("Lütfen bir görsel dosyası seç.");
      return;
    }

    try {
      pendingImage = await resizeImage(file);
      document.getElementById("imagePreview").innerHTML =
        `<img class="photo" style="border-radius:10px" src="${pendingImage}" alt="Önizleme">`;
    } catch {
      alert("Fotoğraf okunamadı.");
    }
  };

  document.getElementById("cancelProduct").onclick = closeModal;
  document.getElementById("saveProduct").onclick = saveProduct;
}

function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;

      img.onload = () => {
        const maxDimension = 1000;
        const scale = Math.min(1, maxDimension / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");

        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        resolve(canvas.toDataURL("image/jpeg", 0.78));
      };

      img.src = reader.result;
    };

    reader.readAsDataURL(file);
  });
}

function saveProduct() {
  const name = document.getElementById("productName").value.trim();
  if (!name) {
    alert("Ürün adı boş bırakılamaz.");
    return;
  }

  const cost = Number(document.getElementById("productCost").value);
  if (!Number.isFinite(cost) || cost < 0) {
    alert("Geçerli bir maliyet gir.");
    return;
  }

  const product = {
    id: editingId || (crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(16).slice(2)),
    name,
    category: document.getElementById("productCategory").value,
    cost,
    currency: document.getElementById("productCurrency").value,
    gram: Number(document.getElementById("productGram").value) || 0,
    description: document.getElementById("productDescription").value.trim(),
    image: pendingImage || ""
  };

  const index = data.products.findIndex(p => p.id === product.id);
  if (index >= 0) data.products[index] = product;
  else data.products.push(product);

  if (!persist()) return;

  modalType = null;
  editingId = null;
  pendingImage = null;
  render();
}

function ratesModal() {
  return `
    <div class="overlay"><div class="modal">
      <h2>Döviz ve altın kurları</h2>
      <p class="small">Değerleri TL cinsinden gir.</p>

      <label>Gram altın (TL)
        <input id="rateGold" type="number" min="0" step="0.01"
          value="${escapeHTML(data.rates.gold)}">
      </label>
      <label>USD (TL)
        <input id="rateUSD" type="number" min="0" step="0.0001"
          value="${escapeHTML(data.rates.usd)}">
      </label>
      <label>EUR (TL)
        <input id="rateEUR" type="number" min="0" step="0.0001"
          value="${escapeHTML(data.rates.eur)}">
      </label>

      <div class="row">
        <button id="cancelRates">Vazgeç</button>
        <button class="primary" id="saveRates">Kaydet</button>
      </div>
    </div></div>`;
}

function bindRatesEvents() {
  document.getElementById("cancelRates").onclick = closeModal;

  document.getElementById("saveRates").onclick = () => {
    const gold = Number(document.getElementById("rateGold").value);
    const usd = Number(document.getElementById("rateUSD").value);
    const eur = Number(document.getElementById("rateEUR").value);

    if ([gold,usd,eur].some(n => !Number.isFinite(n) || n < 0)) {
      alert("Kurlar sıfır veya pozitif sayı olmalı.");
      return;
    }

    data.rates = { gold, usd, eur };
    persist();
    closeModal();
  };
}

function settingsModal() {
  return `
    <div class="overlay"><div class="modal">
      <h2>Hesap ayarları</h2>
      <label>Yönetici kullanıcı adı
        <input id="adminUser" value="${escapeHTML(data.accounts.admin.user)}">
      </label>
      <label>Yönetici şifresi
        <input id="adminPass" type="password" value="${escapeHTML(data.accounts.admin.pass)}">
      </label>
      <label>Müşteri kullanıcı adı
        <input id="viewerUser" value="${escapeHTML(data.accounts.viewer.user)}">
      </label>
      <label>Müşteri şifresi
        <input id="viewerPass" type="password" value="${escapeHTML(data.accounts.viewer.pass)}">
      </label>
      <p class="small">Bu ayarlar yalnızca bu tarayıcıda saklanır. Gerçek bir güvenlik sistemi değildir.</p>
      <div class="row">
        <button id="cancelSettings">Vazgeç</button>
        <button class="primary" id="saveSettings">Kaydet</button>
      </div>
    </div></div>`;
}

function bindSettingsEvents() {
  document.getElementById("cancelSettings").onclick = closeModal;

  document.getElementById("saveSettings").onclick = () => {
    const au = document.getElementById("adminUser").value.trim();
    const ap = document.getElementById("adminPass").value;
    const vu = document.getElementById("viewerUser").value.trim();
    const vp = document.getElementById("viewerPass").value;

    if (!au || !ap || !vu || !vp) {
      alert("Kullanıcı adı ve şifre alanları boş bırakılamaz.");
      return;
    }
    if (au === vu) {
      alert("Yönetici ve müşteri kullanıcı adları farklı olmalı.");
      return;
    }

    data.accounts.admin = { user:au, pass:ap };
    data.accounts.viewer = { user:vu, pass:vp };
    if (!persist()) return;
    closeModal();
  };
}

function viewModal() {
  const p = data.products.find(p => p.id === viewingId);
  if (!p) return "";

  const calculated = calculatePrice(p);

  return `
    <div class="overlay"><div class="modal">
      ${imageHTML(p, true)}
      <div class="muted">${escapeHTML(p.category)}</div>
      <h2>${escapeHTML(p.name)}</h2>
      ${productPriceHTML(p)}
      ${p.gram ? `<div class="muted">Altın: ${number(p.gram)} gr</div>` : ""}
      ${p.description ? `<p>${escapeHTML(p.description)}</p>` : ""}
      ${isAdmin() && calculated ? `
        <div class="rates">
          <span>Maliyet (TL): <b>${money(calculated.baseTRY)}</b></span>
          <span>Formül eklemesi: <b>${money(calculated.sellingTRY - calculated.baseTRY)}</b></span>
        </div>` : ""}
      <div class="row">
        ${isAdmin() ? '<button id="editViewed">Düzenle</button>' : ""}
        <button class="primary" id="closeView">Kapat</button>
      </div>
    </div></div>`;
}

function bindViewEvents() {
  document.getElementById("closeView").onclick = closeModal;

  const edit = document.getElementById("editViewed");
  if (edit) {
    edit.onclick = () => {
      editingId = viewingId;
      modalType = "product";
      render();
    };
  }
}

function closeModal() {
  modalType = null;
  editingId = null;
  viewingId = null;
  pendingImage = null;
  render();
}

// İlk açılış
render();
</script>
</body>
</html>
